<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/style-prosit.css">
    <title>Prosit</title>
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div class="container-menu">

            <a class="logo" href="index.html">
                <img src="../imagenes/logo.jpg"></img>
            </a>

            <nav class="menu">
                <ul>
                    <li><a href="../index.html">Inicio</a></li>
                    <li><a href="servicios.html">Servicios</a></li>
                    <li><a href="clientes.html">Clientes</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section>

        <h1>Formulario de contacto</h1>
        <p class="escribinos">Escribinos y nos comunicaremos con vos.</p>

        <form class="formulario" action="/submit" method="post"> 

            <label for="nombre">Nombre y Apellido</label>
            <input type="text" name="" id="nombre">

            <label for="empresa">Empresa</label>
            <input type="text" name="" id="empresa">

            <label for="provincia">Provincia:</label>
            <select name="" id="">
                <option value="">Córdoba</option>
                <option value="">Buenos Aires</option>
                <option value="">Santa Fe</option>
                <option value="">Salta</option>
                <option value="">Mendoza</option>
                <option value="">Jujuy</option>
                <option value="">Neuquén</option>
                <option value="">Formosa</option>
            </select>

            <label for="mail">Mail</label>
            <input type="text" name="" id="mail">

            <label for="celular">Celular</label>
            <input type="text" name="" id="celular">

            <label for="mensaje">Mensaje</label>
            <textarea type="text" name="" id="mensaje"></textarea>

            <label>Servicio solicitado</label>
            <div class="radio-group">
                <div class="radio-option">
                    <input type="radio" name="servicio" id="costos">
                    <label for="costos">Costos eléctricos</label>
                </div>

                <div class="radio-option">
                    <input type="radio" name="servicio" id="estadisticas">
                    <label for="estadisticas">Estadísticas de consumo</label>
                </div>
                
                <div class="radio-option">
                    <input type="radio" name="servicio" id="otros">
                    <label for="otros">Otro</label>
                </div>
                
            </div>
            
            <div class="checkbox">
                <input type="checkbox" name="suscribe" id="suscribe">
                <label for="suscribe">Prefiero que me contacten por whats app</label>
            </div>
            
            <div class="boton-container">
                <input type="submit" value="Enviar" class="boton-enviar">
            </div>
            
        </form>
    </section>

    <footer class="bg-dark text-white mt-5 py-4">
        <div class="container text-center">
            <p class="mb-3 fs-5">A donde encontrarnos</p>
            <div class="d-flex justify-content-center gap-4">
                <a href="https://www.instagram.com/prositanalytics?igsh=MXZnNmQ1dHNjaDJoeQ%3D%3D&utm_source=qr"
                    target="_blank"><img src="../imagenes/ig.png" alt="Instagram" style="height: 30px;">
                </a>
                <a href="https://www.linkedin.com/company/prosit-analytics/" target="_blank"><img src="../imagenes/in.png"
                    alt="LinkedIn" style="height: 30px;">
                </a>
                <a href="mailto:info@prositanalytics.com" target="_blank"><img src="../imagenes/mail.png" alt="Email" style="height: 30px;">
                </a>
                <a href="https://wa.me/3517011325" target="_blank"><img src="../imagenes/wa.png" alt="WhatsApp" style="height: 30px;">
                </a>       
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
